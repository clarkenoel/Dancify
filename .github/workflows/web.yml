name: Web and launcher

on:
  pull_request:
    paths: ['web/**', 'backend/**', 'pipeline/**', 'schema/**', 'scripts/**', '*.cmd', '.github/workflows/web.yml']
  push:
    paths: ['web/**', 'backend/**', 'pipeline/**', 'schema/**', 'scripts/**', '*.cmd', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: python3 -m unittest discover -s scripts/tests -v

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pipeline/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - name: Install isolated runtimes
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
          backend/.venv/bin/python -m pip check
          python -m venv pipeline/.venv
          pipeline/.venv/bin/python -m pip install -r pipeline/requirements.txt
          pipeline/.venv/bin/python -m pip check
          npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Prepare real media and run browser regressions
        run: bash web/scripts/test-integration.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: web/test-results/
          retention-days: 7
